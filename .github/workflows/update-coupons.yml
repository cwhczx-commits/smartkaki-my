name: Update coupons

on:
  schedule:
    - cron: '0 1 * * *'   # daily at 01:00 UTC (~09:00 Malaysia time)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Fetch latest offers from Involve Asia
        env:
          INVOLVE_ASIA_KEY: ${{ secrets.INVOLVE_ASIA_KEY }}
          INVOLVE_ASIA_SECRET: ${{ secrets.INVOLVE_ASIA_SECRET }}
        run: python fetch_coupons.py

      - name: Post digest to Telegram (skips if nothing changed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_to_telegram.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update coupons.json + telegram post state"
          git push
